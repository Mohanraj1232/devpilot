name: AI Review

# Never change this trigger to `pull_request_target`: that would run untrusted pull
# request code with access to secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # A reusable workflow can only use the permissions granted here.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
      id-token: write
    uses: Mohanraj1232/devpilot/.github/workflows/ai-review.yml@v1
    secrets:
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
    with:
      config_path: .ai-review/config.yml
