name: DevPilot

on:
  issues:
    types: [labeled]

jobs:
  agent:
    if: github.event.label.name == 'devpilot'
    uses: Mohanraj1232/devpilot/.github/workflows/devpilot.yml@v1
    secrets:
      # GitHub App mode (recommended): only these two secrets are needed.
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      # Personal-access-token mode (single owner / sandbox). Leave this secret undefined to use
      # the GitHub App; if it is defined it takes precedence.
      DEVPILOT_BOT_TOKEN: ${{ secrets.DEVPILOT_BOT_TOKEN }}
    with:
      issue_number: ${{ github.event.issue.number }}
