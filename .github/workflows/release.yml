name: Release

# Push a tag like v1.2.3. The workflow re-runs the checks, then moves the major tag
# (v1) to the same commit so target repositories pinned to @v1 pick the release up.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the hub
        working-directory: hub
        run: |
          pip install -e ".[dev]"
          ruff check src/ tests/
          ruff format --check src/ tests/
          mypy src/
          pytest -q

      - name: Check the dashboard
        working-directory: dashboard/backend
        run: |
          pip install -r requirements.txt pytest respx
          pytest -q

      - name: Move the major version tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$major" -m "Release ${GITHUB_REF_NAME}"
          git push --force origin "refs/tags/${major}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
