[alembic]
script_location = alembic
# Put the project root on sys.path so env.py can import `app` however alembic is invoked
# (the `alembic` script, unlike `python -m alembic`, does not add the working directory).
prepend_sys_path = .
sqlalchemy.url = mysql+pymysql://devpilot:devpilot@localhost:3306/devpilot

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
