services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devpilot
      MYSQL_USER: devpilot
      MYSQL_PASSWORD: devpilot
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DEVPILOT_DATABASE_URL: mysql+pymysql://devpilot:devpilot@mysql:3306/devpilot
      DEVPILOT_SECRET_KEY: change-me-in-production
    depends_on:
      mysql:
        condition: service_healthy
    # Apply database migrations, then start the API.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
