services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devpilot
      MYSQL_USER: devpilot
      MYSQL_PASSWORD: devpilot
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DEVPILOT_DATABASE_URL: mysql+pymysql://devpilot:devpilot@mysql:3306/devpilot
      # Required: signs login sessions. Generate one with `openssl rand -hex 32`.
      DEVPILOT_SECRET_KEY: ${DEVPILOT_SECRET_KEY:?set DEVPILOT_SECRET_KEY to a long random value}
      # GitHub OAuth App (login) and the bot account whose access `verify` checks.
      DEVPILOT_GITHUB_CLIENT_ID: ${DEVPILOT_GITHUB_CLIENT_ID:-}
      DEVPILOT_GITHUB_CLIENT_SECRET: ${DEVPILOT_GITHUB_CLIENT_SECRET:-}
      # Set to "development" only for local use over plain HTTP (the login cookie is otherwise Secure).
      DEVPILOT_ENVIRONMENT: ${DEVPILOT_ENVIRONMENT:-production}
      DEVPILOT_BOT_LOGIN: ${DEVPILOT_BOT_LOGIN:-}
      # The GitHub App DevPilot acts as. The private key stays on this server: either pass the PEM
      # (with "\n" escapes) in DEVPILOT_GITHUB_APP_PRIVATE_KEY, or mount a file and set the path.
      DEVPILOT_GITHUB_APP_ID: ${DEVPILOT_GITHUB_APP_ID:-}
      DEVPILOT_GITHUB_APP_SLUG: ${DEVPILOT_GITHUB_APP_SLUG:-}
      DEVPILOT_GITHUB_APP_PRIVATE_KEY: ${DEVPILOT_GITHUB_APP_PRIVATE_KEY:-}
      DEVPILOT_GITHUB_APP_PRIVATE_KEY_PATH: ${DEVPILOT_GITHUB_APP_PRIVATE_KEY_PATH:-}
      # Shared secret configured on the GitHub webhook; empty means webhooks are refused.
      DEVPILOT_WEBHOOK_SECRET: ${DEVPILOT_WEBHOOK_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
    # Apply database migrations, then start the API.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
